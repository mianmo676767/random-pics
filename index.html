<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随机图库 · 每日一图</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#141418;color:#ddd;font-family:system-ui,Segoe UI,sans-serif;
       display:flex;flex-direction:column;align-items:center;min-height:100vh}
  header{padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  select,button{background:#26262e;color:#eee;border:1px solid #3a3a44;border-radius:8px;
                padding:9px 14px;font-size:14px;cursor:pointer}
  button:hover,select:hover{background:#32323c}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;
         padding:10px;position:relative}
  #pic{max-width:95vw;max-height:80vh;border-radius:12px;box-shadow:0 6px 36px rgba(0,0,0,.6);cursor:pointer}
  #spin{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;
        padding:8px 18px;border-radius:20px;font-size:13px;display:none;z-index:5}
  #tip{font-size:12px;color:#888;padding:6px 12px 18px;text-align:center}
  .r18{color:#ff6b81}
</style>
</head>
<body>
<header>
  <select id="src">
    <option value="jitsu1" selected>精选</option>
    <option value="jitsu2">混合随机</option>
    <option value="makuo">Pixiv 快图</option>
    <option value="jitsu0">二次元</option>
    <option value="suyan">素颜 · 二次元</option>
    <option value="alcy_ycy">Alcy · 竖图</option>
    <option value="alcy_pc">Alcy · PC 横屏</option>
    <option value="alcy_fj">Alcy · 动漫风景</option>
    <option value="loli">LoliAPI · 自适应</option>
  </select>
  <button onclick="next()">换一张 (空格)</button>
  <button onclick="openOrig()">原图新标签</button>
</header>
<div id="stage"><img id="pic" alt="随机图"><div id="spin">加载中…</div></div>
<div id="tip">点击图片 / 空格 / F5 换图 · 手机电脑都能开 · 换源请用上方下拉框</div>
<script>
const pic = document.getElementById('pic');
const sel = document.getElementById('src');
const spin = document.getElementById('spin');

const srcs = {
  jitsu1: 'https://moe.jitsu.top/api?r18=1',
  jitsu2: 'https://moe.jitsu.top/api?r18=2',
  makuo:  'https://api.makuo.cc/api/get.img.pixiv',
  jitsu0: 'https://moe.jitsu.top/api?r18=0',
  suyan:  'https://acg.suyanw.cn/random.php',
  alcy_ycy: 'https://t.alcy.cc/ycy',
  alcy_pc:  'https://t.alcy.cc/pc',
  alcy_fj:  'https://t.alcy.cc/fj',
  loli:   'https://www.loliapi.com/acg/',
};

function rnd(){ return Date.now() + Math.random().toString(36).slice(2); }

function showError(msg){
  spin.style.display = 'none';
  document.getElementById('tip').innerHTML = '<span class="r18">' + msg + '</span>';
}
function resetTip(){
  document.getElementById('tip').textContent = '点击图片 / 空格 / F5 换图 · 手机电脑都能开 · 换源请用上方下拉框';
}

// makuo 是 JSON 接口，先取真实图地址；其余直接出图
function next(){
  const v = sel.value;
  resetTip();
  if (v === 'makuo'){
    spin.style.display = 'block'; spin.textContent = '加载中…';
    fetch(srcs.makuo).then(r => r.json()).then(d => {
      spin.style.display = 'none';
      pic.src = d.data;
    }).catch(e => showError('makuo 请求失败: ' + e));
    return;
  }
  pic.src = srcs[v] + '&_t=' + rnd();
}

// 失败自动重试（最多 3 次），换源时重置
let retries = 0;
pic.addEventListener('error', () => {
  if (retries < 3){
    retries++;
    spin.style.display = 'block';
    spin.textContent = '加载失败，自动重试 ' + retries + '/3…';
    setTimeout(() => { pic.src = srcs[sel.value] + '&_t=' + rnd(); }, 900);
  } else {
    showError('这个源现在也抽风了，换个源试试');
  }
});
pic.addEventListener('load', () => { retries = 0; spin.style.display = 'none'; });

pic.onclick = next;
document.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); next(); }
});
function openOrig(){ window.open(pic.src, '_blank'); }
sel.onchange = () => { retries = 0; next(); };
next();
</script>
</body>
</html>
